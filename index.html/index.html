<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo List</title>
    <link rel="stylesheet" href="../style.css/style.css" />
  </head>
  <body>
    <main>
      <h1>My Todo List</h1>

      <form id="todo-form">
        <label for="todo-input">What do you need to do?</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="Enter a task"
          required
        />
        <button type="submit">Add task</button>
      </form>

      <ul id="todo-list" aria-label="Tasks">
        <!-- JavaScript will add each task here. -->
      </ul>
    </main>

    <script src="../script.js/script.js" defer></script>
  </body>
</html>
